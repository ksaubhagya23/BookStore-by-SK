<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue - G.L. Bajaj Online Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="assets/gl-bajaj-logo.png" alt="GL Bajaj logo" class="college-logo">
            <h1>G.L. Bajaj Online Book Store</h1>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Register</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        </nav>
    </header>

    <div class="main-container">
        <aside>
            <h3>Categories</h3>
            <a href="catalogue.html?category=cse" class="category-btn">CSE Books</a>
            <a href="catalogue.html?category=ece" class="category-btn">ECE Books</a>
            <a href="catalogue.html?category=mechanical" class="category-btn">Mechanical Books</a>
            <a href="catalogue.html" class="category-btn">All Books</a>
        </aside>
        <main>
            <h2 class="page-heading" id="catalogue-heading">Book Catalogue</h2>
            <p id="store-message" class="status-message" role="status" aria-live="polite"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Book Image</th>
                            <th scope="col">Book Name</th>
                            <th scope="col">Author Name</th>
                            <th scope="col">Price</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="catalogue-books"></tbody>
                </table>
            </div>
            <p id="empty-catalogue" class="empty-message" hidden>No books are available in this category.</p>
        </main>
    </div>

    <footer>
        <p>Created by Saubhagya Kumar | Roll no. 2501920110336</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
