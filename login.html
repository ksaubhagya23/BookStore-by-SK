<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G.L. Bajaj Online Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="assets/gl-bajaj-logo.png" alt="GL Bajaj logo" class="college-logo">
            <h1>G.L. Bajaj Online Book Store</h1>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="login.html" aria-current="page">Login</a>
            <a href="registration.html">Register</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        </nav>
    </header>

    <div class="main-container">
        <aside>
            <h3>Categories</h3>
            <a href="catalogue.html?category=cse" class="category-btn">CSE Books</a>
            <a href="catalogue.html?category=ece" class="category-btn">ECE Books</a>
            <a href="catalogue.html?category=mechanical" class="category-btn">Mechanical Books</a>
        </aside>
        <main>
            <div class="form-container">
                <h2>Login Page</h2>

                <div id="login-form">
                    <div class="form-group">
                        <label for="username">Email</label>
                        <input type="email" id="username" name="email" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button type="button" class="btn-submit" id="login-button">Login (demo)</button>
                    <p id="store-message" class="status-message" role="status" aria-live="polite"></p>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>Created by Saubhagya Kumar | Roll no. 2501920110336</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
