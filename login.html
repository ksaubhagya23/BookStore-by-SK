<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G.L. Bajaj Online Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>G.L. Bajaj Online Book Store</h1>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="login.html">Login</a> | 
            <a href="register.html">Register</a> | 
            <a href="catalogue.html">Catalogue</a> | 
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <div class="main-container">
        <aside>
            <h3>Categories</h3>
            <a href="catalogue.html" class="category-btn">CSE Books</a>
            <a href="catalogue.html" class="category-btn">ECE Books</a>
            <a href="catalogue.html" class="category-btn">Mechanical Books</a>
        </aside>

        <main>
            <div class="form-container">
                <h2>Login Page</h2>
                <form action="catalogue.html" method="get">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn-submit">Login</button>
                </form>
            </div>
        </main>
    </div>

    <footer>
        <p>Created by Saubhagya Kumar | Roll no. 2501920110336</p>
    </footer>

</body>
</html>
