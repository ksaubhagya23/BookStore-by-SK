<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - G.L. Bajaj Online Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="assets/gl-bajaj-logo.png" alt="GL Bajaj logo" class="college-logo">
            <h1>G.L. Bajaj Online Book Store</h1>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html" aria-current="page">Register</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
        </nav>
    </header>

    <div class="main-container">
        <aside>
            <h3>Categories</h3>
            <a href="catalogue.html?category=cse" class="category-btn">CSE Books</a>
            <a href="catalogue.html?category=ece" class="category-btn">ECE Books</a>
            <a href="catalogue.html?category=mechanical" class="category-btn">Mechanical Books</a>
        </aside>
        <main>
            <div class="form-container">
                <h2>Registration Page</h2>

                <div id="registration-form">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="full-name" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="mobile">Mobile No.</label>
                        <input type="tel" id="mobile" name="mobile" autocomplete="tel" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" name="password" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                    </div>
                    <fieldset class="form-group">
                        <legend>Sex</legend>
                        <div class="radio-group">
                            <label><input type="radio" name="sex" value="male"> Male</label>
                            <label><input type="radio" name="sex" value="female"> Female</label>
                            <label><input type="radio" name="sex" value="other"> Other</label>
                        </div>
                    </fieldset>
                    <div class="form-group">
                        <label for="date-of-birth">Date of Birth</label>
                        <input type="date" id="date-of-birth" name="date-of-birth">
                    </div>
                    <fieldset class="form-group">
                        <legend>Languages Known</legend>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="languages" value="english"> English</label>
                            <label><input type="checkbox" name="languages" value="hindi"> Hindi</label>
                            <label><input type="checkbox" name="languages" value="telugu"> Telugu</label>
                            <label><input type="checkbox" name="languages" value="tamil"> Tamil</label>
                        </div>
                    </fieldset>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your address here"></textarea>
                    </div>
                    <button type="button" class="btn-submit" id="register-button">Register (demo)</button>
                    <p id="store-message" class="status-message" role="status" aria-live="polite"></p>
                </div>
            </div>
        </main>
    </div>

    <footer>
        <p>Created by Saubhagya Kumar | Roll no. 2501920110336</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
